# ---- Comum às duas metades -------------------------------------------------

# Ecrã OLED 128x32 com os ecrãs personalizados (src/display/)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Suporte a rato / apontador (trackpad, input-split e &mkp)
CONFIG_ZMK_POINTING=y

# ---- RGB (27 LEDs por metade: 6 underglow + 21 por tecla) -----------------
CONFIG_ZMK_RGB_UNDERGLOW=y
# IMPORTANTE: o trackpad e o OLED são alimentados pelo VCC. Por defeito, desligar
# o RGB também cortaria o VCC (ext-power) e o trackpad deixava de funcionar.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Poupar bateria: apaga quando o teclado fica inativo e quando não há USB
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# Limita o brilho (27 LEDs a 100% consomem demasiado para o regulador)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1
