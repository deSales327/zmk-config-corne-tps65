manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config

# O driver do trackpad Azoteq (IQS5xx / TPS65) está nesta própria repo
# (pastas drivers/, dts/ e zephyr/module.yml), com uma correção para o RDY.
# Original: https://github.com/essenceotd/zmk_driver_azoteq
