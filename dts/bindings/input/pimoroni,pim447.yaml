description: Pimoroni Trackball Breakout (PIM447) — I2C, address 0x0A (0x0B alt.)

compatible: "pimoroni,pim447"

include: i2c-device.yaml

properties:
  int-gpios:
    type: phandle-array
    description: INT pin (active low). Without it the driver polls.
  poll-interval-ms:
    type: int
    default: 15
    description: Poll period when no INT pin is used (or INT setup fails).
  idle-poll-interval-ms:
    type: int
    default: 100
    description: Poll period while the ball is still (polling mode only; saves battery).
  rotation:
    type: int
    default: 0
    enum: [0, 90, 180, 270]
    description: Rotate the ball axes clockwise (degrees) to match how it is mounted. Applies to cursor and scroll.
  noise-threshold:
    type: int
    default: 1
    description: Ball counts needed (within 80 ms) to start moving from rest. 1 = off; 2-3 filter stray counts (jitter).
  smoothing:
    type: int
    default: 0
    description: Cursor smoothing. 0/1 = off; N = each step sends 1/N of the pending movement (higher = smoother, more lag).
  smooth-interval-ms:
    type: int
    default: 8
    description: Time between smoothing steps.
  cursor-multiplier:
    type: int
    default: 6
    description: Base cursor speed (pixels per ball count when moving slowly).
  acceleration:
    type: int
    default: 4
    description: Speed-based acceleration (0 = linear, higher = faster when flicking).
  scroll-divisor:
    type: int
    default: 1
    description: Ball counts per scroll step (higher = slower scroll).
  click-toggles-scroll:
    type: boolean
    description: Ball click toggles cursor/scroll mode instead of sending a mouse button.
  led-feedback:
    type: boolean
    description: Flash the ball LED on mode change (blue = cursor, green = scroll).
  led-brightness:
    type: int
    default: 64
    description: LED brightness for feedback flashes (0-255).
