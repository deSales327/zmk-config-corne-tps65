# Corne v3 (6 colunas) + nice!nano v2 compatível (Pro Micro nRF52840 "V1940")
# Esquerda = central | Direita = periférico com trackpad Azoteq TPS65
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset
  # Direita com logs por USB (diagnóstico do trackpad)
  - board: nice_nano//zmk
    shield: corne_right
    snippet: zmk-usb-logging
    artifact-name: corne_right_usb_logging
    # espera 10 s antes de enviar os logs (dá tempo de abrir o PuTTY) e buffer maior
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000 -DCONFIG_LOG_BUFFER_SIZE=8192
