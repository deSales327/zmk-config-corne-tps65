# Corne v3 (6 colunas) + nice!nano v2 compatível (Pro Micro nRF52840 "V1940")
# Esquerda = central | Direita = periférico com trackpad Azoteq TPS65
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset
  # Direita com logs por USB (diagnóstico do trackpad)
  - board: nice_nano//zmk
    shield: corne_right
    snippet: zmk-usb-logging
    artifact-name: corne_right_usb_logging
    # espera 30 s antes de enviar os logs (dá tempo de abrir o PuTTY) ; buffer maior; logs detalhados do trackpad
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=30000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_INPUT_LOG_LEVEL_DBG=y -DCONFIG_INPUT_TPS43_RDY_POLL=y
