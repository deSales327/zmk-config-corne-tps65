# Corne v3 (6 colunas) + nice!nano v2 compatível (Pro Micro nRF52840 "V1940")
# Esquerda = central, com o trackpad Azoteq TPS65 (fase inicial)
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset
  # Esquerda com logs por USB (diagnóstico do trackpad)
  - board: nice_nano//zmk
    shield: corne_left
    snippet: zmk-usb-logging
    artifact-name: corne_left_usb_logging
